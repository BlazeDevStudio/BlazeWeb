<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 815" width="1400" height="815" role="img" aria-labelledby="title desc"><title id="title">LM386 internal topology map based on manufacturer schematic</title><desc id="desc">Educational overview of the internal transistor groups and documented resistor values within the LM386, including fifty-kilohm input bias paths, two fifteen-kilohm bias resistors, 150-ohm and 1.35-kilohm gain network, differential input transistors, output bias diodes and class AB output drivers. This is not an electrically complete transistor-level circuit, and should not be used for building or reconstructing the IC. Refer to TI SNAS545D page 1 for the exact internal schematic.</desc><rect width="1400" height="815" rx="18" fill="#101D31"/><text x="44" y="55" fill="#EDF5FF" text-anchor="start" font-family="monospace" font-size="31">LM386 / INSIDE THE AMPLIFIER</text><text x="46" y="91" fill="#A4B8D4" text-anchor="start" font-family="monospace" font-size="15">ANATOMY OF THE SIGNAL PATH  •  COMPONENT VALUES FROM TI SNAS545D, PAGE 1</text><line x1="44" y1="111" x2="1353" y2="111" stroke="#436489" stroke-width="1" /><rect x="48" y="148" width="345" height="390" rx="9" fill="#142540" stroke="#4E7CAD" stroke-width="1.6"/><text x="64" y="181" fill="#79B3FF" text-anchor="start" font-family="monospace" font-size="18">01 / INPUT STAGE</text><text x="73" y="207" fill="#EDF5FF" text-anchor="start" font-family="monospace" font-size="15">PIN 2  /  −INPUT</text><text x="73" y="246" fill="#EDF5FF" text-anchor="start" font-family="monospace" font-size="15">PIN 3  /  +INPUT</text><circle cx="160" cy="342" r="28" fill="#192D47" stroke="#98C5ED" stroke-width="1.6"/><line x1="145" y1="324" x2="145" y2="360" stroke="#99C4ED" stroke-width="2" /><line x1="122" y1="342" x2="145" y2="342" stroke="#99C4ED" stroke-width="2" /><line x1="145" y1="331" x2="173" y2="313" stroke="#99C4ED" stroke-width="2" /><line x1="145" y1="353" x2="173" y2="371" stroke="#99C4ED" stroke-width="2" /><text x="160" y="391" fill="#BCD8F6" text-anchor="middle" font-family="monospace" font-size="13">PNP / input A</text><circle cx="294" cy="342" r="28" fill="#192D47" stroke="#98C5ED" stroke-width="1.6"/><line x1="279" y1="324" x2="279" y2="360" stroke="#99C4ED" stroke-width="2" /><line x1="256" y1="342" x2="279" y2="342" stroke="#99C4ED" stroke-width="2" /><line x1="279" y1="331" x2="307" y2="313" stroke="#99C4ED" stroke-width="2" /><line x1="279" y1="353" x2="307" y2="371" stroke="#99C4ED" stroke-width="2" /><text x="294" y="391" fill="#BCD8F6" text-anchor="middle" font-family="monospace" font-size="13">PNP / input B</text><line x1="95" y1="207" x2="119" y2="207" stroke="#99C4ED" stroke-width="2" /><line x1="119" y1="207" x2="119" y2="292" stroke="#99C4ED" stroke-width="2" stroke-dasharray="7 8" /><line x1="95" y1="246" x2="253" y2="246" stroke="#99C4ED" stroke-width="2" /><line x1="253" y1="246" x2="253" y2="292" stroke="#99C4ED" stroke-width="2" stroke-dasharray="7 8" /><text x="73" y="465" fill="#79B3FF" text-anchor="start" font-family="monospace" font-size="15">50 kΩ INPUT BIAS EACH</text><text x="73" y="503" fill="#A4B8D4" text-anchor="start" font-family="monospace" font-size="13">GROUND-REFERENCED INPUTS</text><rect x="421" y="148" width="462" height="390" rx="9" fill="#142540" stroke="#4E7CAD" stroke-width="1.6"/><text x="437" y="181" fill="#79B3FF" text-anchor="start" font-family="monospace" font-size="18">02 / BIAS AND GAIN</text><text x="446" y="201" fill="#EDF5FF" text-anchor="start" font-family="monospace" font-size="15">PIN 7 / BYPASS</text><text x="446" y="235" fill="#A4B8D4" text-anchor="start" font-family="monospace" font-size="15">15 kΩ + 15 kΩ bias ladder</text><path d="M472 286l10 -10 12 20 12 -20 12 20 10 -10" fill="none" stroke="#BCDCF5" stroke-width="2"/><text x="555" y="292" fill="#EDF5FF" text-anchor="start" font-family="monospace" font-size="15">15 kΩ</text><path d="M472 354l10 -10 12 20 12 -20 12 20 10 -10" fill="none" stroke="#BCDCF5" stroke-width="2"/><text x="555" y="360" fill="#EDF5FF" text-anchor="start" font-family="monospace" font-size="15">15 kΩ</text><line x1="500" y1="306" x2="500" y2="336" stroke="#99C4ED" stroke-width="2" /><line x1="500" y1="374" x2="500" y2="391" stroke="#99C4ED" stroke-width="2" /><text x="623" y="201" fill="#79B3FF" text-anchor="start" font-family="monospace" font-size="15">PIN 8</text><text x="773" y="201" fill="#79B3FF" text-anchor="start" font-family="monospace" font-size="15">PIN 1</text><line x1="641" y1="241" x2="807" y2="241" stroke="#A9CAE9" stroke-width="2" /><path d="M662 241l8 -10 12 20 12 -20 12 20 8 -10" fill="none" stroke="#A9CAE9" stroke-width="2"/><path d="M742 241l8 -10 12 20 12 -20 12 20 8 -10" fill="none" stroke="#A9CAE9" stroke-width="2"/><text x="688" y="279" fill="#BFD7F0" text-anchor="middle" font-family="monospace" font-size="14">150 Ω</text><text x="770" y="279" fill="#BFD7F0" text-anchor="middle" font-family="monospace" font-size="14">1.35 kΩ</text><text x="442" y="449" fill="#79B3FF" text-anchor="start" font-family="monospace" font-size="15">Internal feedback: 15 kΩ</text><text x="442" y="484" fill="#A4B8D4" text-anchor="start" font-family="monospace" font-size="13">Gain externally adjustable 20–200</text><rect x="914" y="148" width="436" height="390" rx="9" fill="#142540" stroke="#4E7CAD" stroke-width="1.6"/><text x="930" y="181" fill="#79B3FF" text-anchor="start" font-family="monospace" font-size="18">03 / DRIVER + OUTPUT</text><circle cx="1024" cy="317" r="28" fill="#192D47" stroke="#98C5ED" stroke-width="1.6"/><line x1="1009" y1="299" x2="1009" y2="335" stroke="#99C4ED" stroke-width="2" /><line x1="986" y1="317" x2="1009" y2="317" stroke="#99C4ED" stroke-width="2" /><line x1="1009" y1="306" x2="1037" y2="288" stroke="#99C4ED" stroke-width="2" /><line x1="1009" y1="328" x2="1037" y2="346" stroke="#99C4ED" stroke-width="2" /><text x="1024" y="366" fill="#BCD8F6" text-anchor="middle" font-family="monospace" font-size="13">PNP / drive</text><circle cx="1208" cy="317" r="28" fill="#192D47" stroke="#98C5ED" stroke-width="1.6"/><line x1="1193" y1="299" x2="1193" y2="335" stroke="#99C4ED" stroke-width="2" /><line x1="1170" y1="317" x2="1193" y2="317" stroke="#99C4ED" stroke-width="2" /><line x1="1193" y1="306" x2="1221" y2="288" stroke="#99C4ED" stroke-width="2" /><line x1="1193" y1="328" x2="1221" y2="346" stroke="#99C4ED" stroke-width="2" /><text x="1208" y="366" fill="#BCD8F6" text-anchor="middle" font-family="monospace" font-size="13">NPN / output</text><text x="943" y="433" fill="#79B3FF" text-anchor="start" font-family="monospace" font-size="16">DIODE BIAS NETWORK</text><text x="943" y="465" fill="#A4B8D4" text-anchor="start" font-family="monospace" font-size="13">COMPLEMENTARY OUTPUT STAGE</text><text x="943" y="500" fill="#EDF5FF" text-anchor="start" font-family="monospace" font-size="15">PIN 5  /  VOUT</text><line x1="393" y1="344" x2="421" y2="344" stroke="#79B3FF" stroke-width="3" stroke-dasharray="7 8" /><line x1="883" y1="344" x2="914" y2="344" stroke="#79B3FF" stroke-width="3" stroke-dasharray="7 8" /><text x="72" y="612" fill="#79B3FF" text-anchor="start" font-family="monospace" font-size="20">INTEGRATED-CIRCUIT REFERENCE</text><text x="72" y="650" fill="#EDF5FF" text-anchor="start" font-family="monospace" font-size="17">TI publishes the full internal transistor schematic (including all transistor interconnects).</text><text x="72" y="685" fill="#A4B8D4" text-anchor="start" font-family="monospace" font-size="16">This figure groups documented structures to explain operation; it is NOT a silicon netlist.</text><line x1="72" y1="733" x2="1348" y2="733" stroke="#436489" stroke-width="1" /><text x="73" y="769" fill="#A4B8D4" text-anchor="start" font-family="monospace" font-size="16">EXACT INTERNAL TRANSISTOR-LEVEL SCHEMATIC: TI SNAS545D, PAGE 1</text><text x="1320" y="769" fill="#E65C73" text-anchor="end" font-family="monospace" font-size="14">REFERENCE / NOT FOR WIRING</text></svg>