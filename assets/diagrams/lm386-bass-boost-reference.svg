<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc"><title id="title">LM386 9-volt 8-ohm bass-boost audio amplifier electrical schematic</title><desc id="desc">Buildable external circuit based on Texas Instruments LM386 datasheet Figure 9-9. Pin 1 through 33-nanofarad and 10-kilohm in series to output pin 5, pin 8 open, 10-kilohm volume pot to pin 3, pin 2 and 4 grounded, pin 6 powered at 9 volts, pin 7 bypassed with 10 microfarad, 50-nanofarad and 10-ohm Zobel on pin 5, 250-microfarad output coupling capacitor positive to pin 5 followed by 8-ohm speaker to ground. Also supply rail decoupling.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#668CB2" opacity=".12" stroke-width=".7" fill="none"/></pattern></defs><rect width="1400" height="850" rx="16" fill="#101D31"/><rect width="1400" height="850" rx="16" fill="url(#grid)"/><text x="43" y="53" font-family="monospace" font-size="30" fill="#EBF4FF" text-anchor="start" font-weight="700">LM386 / LOW-VOLTAGE AUDIO AMPLIFIER</text><text x="44" y="86" font-family="monospace" font-size="15" fill="#A4B8D4" text-anchor="start" font-weight="400">9 V DC  /  8 Ω LOUDSPEAKER   •   TI SNAS545D, FIG 9-9 TOPOLOGY</text><text x="1350" y="56" font-family="monospace" font-size="16" fill="#79B3FF" text-anchor="end" font-weight="400">FIG 01 / EXTERNAL</text><path d="M44 108L1353 108" fill="none" stroke="#46698C" stroke-width="1.5" stroke-linecap="round"/><text x="60" y="146" font-family="monospace" font-size="15" fill="#79B3FF" text-anchor="start" font-weight="700">POWER +9 V / COMMON GROUND</text><path d="M145 181L637 181" fill="none" stroke="#A9CAE9" stroke-width="2" stroke-linecap="round"/><circle cx="145" cy="181" r="4" fill="#A9CAE9"/><text x="67" y="181" font-family="monospace" font-size="16" fill="#EBF4FF" text-anchor="start" font-weight="700">+9 V</text><text x="67" y="221" font-family="mono