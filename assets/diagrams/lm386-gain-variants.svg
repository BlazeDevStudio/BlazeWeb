<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="425" viewBox="0 0 1320 425" role="img" aria-labelledby="title description"><title id="title">LM386 gain setting connections — 20, 50, 200 voltage gain</title><desc id="description">Alternate LM386 gain configurations. Gain 20: pins 1 and 8 open. Gain 50: 1.2 kiloohm resistor in series with 10 microfarad capacitor between pins 1 and 8, capacitor positive terminal toward pin 1. Gain 200: 10 microfarad capacitor alone between pins 1 and 8, positive toward pin 1. These are alternative arrangements and should not be combined with the displayed bass boost wiring without independent circuit review. From TI SNAS545D sections 9.2.1 through 9.2.3.</desc>
<rect width="1320" height="425" fill="#101D31" rx="12"/><text x="30" y="43" font-family="ui-monospace,monospace" font-size="26" font-weight="bold" fill="#EDF5FF">GAIN CONTROL / ALTERNATE CONFIGURATIONS</text><text x="30" y="70" font-family="ui-monospace,monospace" font-size="14" fill="#A8B8D3">TI LM386 • SNAS545D • sections 9.2.1–9.2.3 • one option at a time</text>
<rect x="25" y="98" width="410" height="287" rx="8" fill="#14243A" stroke="#426485" stroke-width="1.2"/><text x="47" y="133" text-anchor="start" font-family="ui-monospace,monospace" font-size="20" fill="#79B3FF">GAIN = 20 (26 dB)</text><text x="47" y="160" text-anchor="start" font-family="ui-monospace,monospace" font-size="14" fill="#A8B8D3">DEFAULT • BOTH PINS OPEN</text><text x="230" y="233" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#A8B8D3">NO CONNECTION</text><circle cx="90" cy="230" r="7" fill="#101D31" stroke="#B3CDE7" stroke-width="2.2"/><text x="90" y="276" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#ACC1D9">PIN 1</text><circle cx="368" cy="230" r="7" fill="#101D31" stroke="#B3CDE7" stroke-width="2.2"/><text x="368" y="276" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#ACC1D9">PIN 8</text><rect x="455" y="98" width="410" height="287" rx="8" fill="#14243A" stroke="#426485" stroke-width="1.2"/><text x="477" y="133" text-anchor="start" font-family="ui-monospace,monospace" font-size="20" fill="#79B3FF">GAIN ≈ 50 (34 dB)</text><text x="477" y="160" text-anchor="start" font-family="ui-monospace,monospace" font-size="14" fill="#A8B8D3">1.2 kΩ IN SERIES WITH 10 µF</text><path d="M527 230L576 230" fill="none" stroke="#91B8DD" stroke-width="2" stroke-linecap="square"/><path d="M576 230 l8 -10 12 20 12 -20 12 20 12 -20 12 20 8 -10" fill="none" stroke="#B5D6FF" stroke-width="2"/><path d="M660 230L697 230" fill="none" stroke="#91B8DD" stroke-width="2" stroke-linecap="square"/><path d="M697 211L697 249" fill="none" stroke="#91B8DD" stroke-width="2.8" stroke-linecap="square"/><path d="M719 211L719 249" fill="none" stroke="#91B8DD" stroke-width="2.8" stroke-linecap="square"/><path d="M719 230L791 230" fill="none" stroke="#91B8DD" stroke-width="2" stroke-linecap="square"/><text x="618" y="208" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#EDF5FF">1.2 kΩ</text><text x="708" y="281" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#EDF5FF">10 µF</text><text x="686" y="204" text-anchor="middle" font-family="ui-monospace,monospace" font-size="21" fill="#E65C73">+</text><circle cx="520" cy="230" r="7" fill="#101D31" stroke="#B3CDE7" stroke-width="2.2"/><text x="520" y="276" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#ACC1D9">PIN 1</text><circle cx="798" cy="230" r="7" fill="#101D31" stroke="#B3CDE7" stroke-width="2.2"/><text x="798" y="276" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#ACC1D9">PIN 8</text><rect x="885" y="98" width="410" height="287" rx="8" fill="#14243A" stroke="#426485" stroke-width="1.2"/><text x="907" y="133" text-anchor="start" font-family="ui-monospace,monospace" font-size="20" fill="#79B3FF">GAIN = 200 (46 dB)</text><text x="907" y="160" text-anchor="start" font-family="ui-monospace,monospace" font-size="14" fill="#A8B8D3">10 µF CAPACITOR ONLY</text><path d="M957 230L1079 230" fill="none" stroke="#91B8DD" stroke-width="2" stroke-linecap="square"/><path d="M1079 211L1079 249" fill="none" stroke="#91B8DD" stroke-width="2.8" stroke-linecap="square"/><path d="M1102 211L1102 249" fill="none" stroke="#91B8DD" stroke-width="2.8" stroke-linecap="square"/><path d="M1102 230L1221 230" fill="none" stroke="#91B8DD" stroke-width="2" stroke-linecap="square"/><text x="1091" y="282" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#EDF5FF">10 µF</text><text x="1066" y="204" text-anchor="middle" font-family="ui-monospace,monospace" font-size="21" fill="#E65C73">+</text><circle cx="950" cy="230" r="7" fill="#101D31" stroke="#B3CDE7" stroke-width="2.2"/><text x="950" y="276" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#ACC1D9">PIN 1</text><circle cx="1228" cy="230" r="7" fill="#101D31" stroke="#B3CDE7" stroke-width="2.2"/><text x="1228" y="276" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#ACC1D9">PIN 8</text><path d="M30 401H1290" stroke="#385575" stroke-width="1"/><text x="30" y="416" font-family="ui-monospace,monospace" font-size="12" fill="#A8B8D3">CIRCUIT VARIANTS ONLY • Do not install simultaneously or mix with the bass-boost feedback network without redesign.</text></svg>